name: MysticEgo R3.2.42 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-r3242.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mysticego-release-r3242
  cancel-in-progress: false

jobs:
  platform:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check platform prerequisites
        run: ssh -V
      - name: Read-only production preview reachability (previous deployed version)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          site=https://orchestra.isdarkline.ru
          page="$RUNNER_TEMP/live-social.html"
          cover="$RUNNER_TEMP/live-social.png"
          echo "Checking existing public site before release, not claiming deployment of this build."
          for ua in 'Mozilla/5.0' 'TelegramBot (like TwitterBot)'; do
            echo "User-Agent: $ua"
            curl --silent --show-error --connect-timeout 5 --max-time 15 --proto '=https' -A "$ua" -o "$page" -w 'HTML HTTP %{http_code} MIME %{content_type} bytes %{size_download}\n' "$site/"
            if [ "$?" = 0 ]; then
              python3 - "$page" "$site" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__(); self.values={}
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='meta' and a.get('property','').startswith('og:'):
                      self.values[a['property']]=a.get('content','')
          parser=Tags()
          parser.feed(Path(sys.argv[1]).read_text(errors='replace'))
          for key in ('og:title','og:description','og:image','og:url'):
              print(key, 'present' if parser.values.get(key) else 'missing')
          print('Configured public cover URL:',parser.values.get('og:image')==sys.argv[2]+'/og/orchestra.png')
          PY
            fi
          done
          curl --silent --show-error --connect-timeout 5 --max-time 15 --proto '=https' -A 'TelegramBot (like TwitterBot)' -o "$cover" -w 'PNG HTTP %{http_code} MIME %{content_type} bytes %{size_download}\n' "$site/og/orchestra.png"
          if [ -f "$cover" ]; then python3 -c 'from pathlib import Path; import sys; print("PNG signature:",Path(sys.argv[1]).read_bytes()[:8].hex()=="89504e470d0a1a0a")' "$cover"; fi
          exit 0
      - name: Publish backend and exercise local platform operations
        run: |
          dotnet publish tools/MysticEgo.CloudDesk/backend/CloudDesk.csproj -c Release -o platform-out
          node ops/desktop-releases/clouddesk-smoke.mjs dotnet platform-out/CloudDesk.dll
      - name: Check Electron main syntax
        run: |
          node --test desktop/desktop-updates.test.cjs desktop/interface-mcp.test.cjs
          node --check tools/MysticEgo.CloudDesk/desktop/main.cjs
          node --check tools/MysticEgo.CloudDesk/desktop/local-center.cjs
          node --test ops/desktop-releases/local-center.test.cjs
          node ops/desktop-releases/clouddesk-recovery-smoke.mjs
          dotnet build tools/MysticEgo.Installer/MysticEgo.Installer.csproj -c Release
  database:
    strategy:
      fail-fast: false
      matrix:
        method: [postgres-native, postgres]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install database on disposable runner and exercise real providers
        env:
          METHOD: ${{ matrix.method }}
        run: |
          stage=$(mktemp -d)
          cp ops/infrastructure/{install.py,install.sh} "$stage/"
          printf '{"component":"%s","bind":"127.0.0.1","cidr":"127.0.0.1/32"}\n' "$METHOD" > "$stage/request.json"
          sudo bash "$stage/install.sh"
          printf '{"component":"prepare-postgres","role":"orchestra","bind":"127.0.0.1"}\n' > "$stage/request.json"
          sudo bash "$stage/install.sh"
          connection=$(sudo cat /etc/mysticego/database-staging/orchestra-postgres.connection)
          echo "::add-mask::$connection"
          MYSTICEGO_TEST_POSTGRES="$connection" dotnet run --project tests/RelationalStorageSmoke/RelationalStorageSmoke.csproj
          rm -rf "$stage"
      - name: Check local socket allowlist and Python syntax
        run: |
          python3 -m py_compile ops/infrastructure/install.py
          python3 tests/InfrastructureLocalSocketSmoke.py
          bash -n tools/MysticEgo.CloudDesk/profiles/orchestra-r3.sh
  release:
    needs: [platform, database]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.0-beta.7-r3.2.42
      ASSET: MysticEgo_BETA7_R3.2.42.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify previous full bundle
        run: |
          previous=v1.0.0-beta.7-r3.2.41
          asset=MysticEgo_BETA7_R3.2.41.zip
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous" > "$RUNNER_TEMP/previous-release.json"
          digest=$(python3 - "$RUNNER_TEMP/previous-release.json" "$previous" "$asset" <<'PY'
          import json,re,sys
          release=json.load(open(sys.argv[1]))
          assert not release["draft"] and release["tag_name"]==sys.argv[2]
          matches=[a for a in release["assets"] if a["name"]==sys.argv[3] and a["state"]=="uploaded"]
          assert len(matches)==1
          digest=matches[0].get("digest","")
          assert re.fullmatch(r"sha256:[0-9a-f]{64}",digest), "Previous published bundle lacks a verified SHA-256 digest"
          print(digest.split(":")[1])
          PY
          )
          test "$digest" = 49aacfed1e2715c9bd1c4d076be389d0d3892f614fba9af9f6b60f159284e7d0
          gh release download "$previous" --pattern "$asset"
          printf '%s  %s\n' "$digest" "$asset" | sha256sum -c -
          unzip -q "$asset" -d bundle
          git archive --format=tar HEAD | tar -xf - -C bundle/MysticEgo
      - name: Build CloudDesk and web panels
        run: |
          dotnet publish tools/MysticEgo.CloudDesk/backend/CloudDesk.csproj -c Release -o "$RUNNER_TEMP/clouddesk"
          dotnet publish tools/MysticEgo.DatabaseMigration/MysticEgo.DatabaseMigration.csproj -c Release -p:UseAppHost=false -o "$RUNNER_TEMP/database-migration"
          npm --prefix tools/MysticEgo.CloudDesk install --ignore-scripts --no-audit
          npm --prefix tools/MysticEgo.CloudDesk run build
          npm --prefix frontend ci --ignore-scripts --no-audit
          npm --prefix frontend run build
          npm --prefix desktop ci --ignore-scripts --no-audit
          npm --prefix desktop run build
          dotnet run --project tests/DesktopDownloadsSmoke/DesktopDownloadsSmoke.csproj
          for role in Global Agent AuditOrchestra; do dotnet build "services/Api.$role/Api.$role.csproj" -c Release; done
          dotnet build core/Api.Auth/Api.Auth.csproj -c Release
          dotnet build services/Api.Orchestra/Api.Orchestra.csproj -c Release
          dotnet build services/Api.Local/Api.Local.csproj -c Release
          dotnet build services/Api.Capacity/Api.Capacity.csproj -c Release
          dotnet run --project tests/AuthSmoke/AuthSmoke.csproj -c Release
          dotnet run --project tests/CapacitySmoke/CapacitySmoke.csproj -c Release
          dotnet run --project tests/ApiArchitectureSmoke/ApiArchitectureSmoke.csproj -c Release
          node --test frontend/scripts/avatar-motion.test.mjs frontend/scripts/localization.test.mjs
          MYSTICEGO_SOCIAL_DIST="$PWD/frontend/apps" dotnet run --project tests/BetaResilienceSmoke/BetaResilienceSmoke.csproj -c Release
          dotnet build tools/MysticEgo.Installer/MysticEgo.Installer.csproj -c Release
          bash -n ops/infrastructure/install.sh
          bash -n ops/infrastructure/run-web.sh
          bash -n ops/infrastructure/install-local.sh
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile ops/infrastructure/local-runner.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 tests/InfrastructureLocalSocketSmoke.py
          node --check desktop/station/main.mjs
          node --check desktop/station/view.js
          bash -n ops/panel-assistant/install-default-model.sh
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile ops/infrastructure/install.py
      - name: Verify real browser rendering before packaging
        run: |
          npm --prefix frontend/visual install --ignore-scripts --no-audit --no-package-lock
          npm --prefix frontend/visual exec -- playwright install --with-deps chromium
          npm --prefix frontend/visual test
          node frontend/visual/desktop-update-smoke.mjs
          python3 -m unittest discover -s ops/infrastructure -p 'test_reconcile.py'
          python3 -m unittest discover -s ops/orchestra-updater -p 'test_*.py'
          bash ops/desktop-releases/linux-installer-smoke.sh
          bash -n ops/orchestra-updater/recover-maintenance.sh
          bash -n ops/orchestra-updater/install-worker.sh
          bash -n tools/MysticEgo.CloudDesk/profiles/orchestra-r3.sh
          bash -n tools/MysticEgo.CloudDesk/profiles/orchestra-reset.sh
          bash -n ops/panel-assistant/install-default-model.sh
          dotnet run --project tests/DiagnosticReportSmoke/DiagnosticReportSmoke.csproj -c Release
          python3 -m py_compile ops/infrastructure/{reconcile,voice-server,local-runner}.py
          bash -n ops/infrastructure/install-local.sh
          bash -n ops/infrastructure/install-voice.sh
        env:
          VISUAL_OUTPUT: ${{ runner.temp }}/mystic-release-visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-screenshots
          path: ${{ runner.temp }}/mystic-release-visual
          if-no-files-found: warn
          retention-days: 14
      - name: Assemble and verify release
        run: |
          root="$PWD/bundle/MysticEgo"
          desk="$root/tools/MysticEgo.CloudDesk"
          rm -rf "$desk/dist" "$desk/out"
          cp -a tools/MysticEgo.CloudDesk/dist "$desk/dist"
          rm -rf "$root/desktop/dist"
          cp -a desktop/dist "$root/desktop/dist"
          mkdir -p "$desk/out"
          cp -a "$RUNNER_TEMP/clouddesk/." "$desk/out/"
          test -s "$desk/out/profiles/orchestra-reset.sh"
          migration="$root/tools/MysticEgo.DatabaseMigration/out"
          rm -rf "$migration"
          mkdir -p "$migration"
          cp -a "$RUNNER_TEMP/database-migration/." "$migration/"
          test -f "$migration/MysticEgo.DatabaseMigration.dll"
          test -f "$migration/MysticEgo.DatabaseMigration.runtimeconfig.json"
          code=0
          dotnet "$migration/MysticEgo.DatabaseMigration.dll" || code=$?
          test "$code" = 2
          mkdir -p "$desk/windows-tools"
          bash ops/desktop-releases/windows-tools.sh "$desk/windows-tools"
          api=services/Api.Orchestra/bin/Release/net10.0/Api.Orchestra.dll
          sha256sum "$root/runtime/app/bin/Api.Orchestra.dll" | cut -d ' ' -f 1 > "$root/ops/orchestra-updater/baseline.sha256"
          # Refresh every rebuilt host and its dependency manifests, not only selected DLLs.
          python3 ops/desktop-releases/refresh-runtime.py "$root/runtime/app/bin"
          for name in Api.Orchestra Api.Auth Api.Global Api.Local Api.Agent Api.AuditOrchestra Api.Capacity MysticEgo.Installer; do
            for extension in dll deps.json runtimeconfig.json; do
              test -s "$root/runtime/app/bin/$name.$extension"
            done
          done
          test -s "$root/runtime/app/bin/MysticEgo.Capacity.dll"
          test -x "$root/local-desktop"
          test -f "$root/LocalDesktop.cmd"
          test -f "$root/desktop/local/local-icon.png"
          sh -n "$root/local-desktop"
          node --check "$root/desktop/local/main.mjs"
          test -x "$root/agent-desktop"
          test -f "$root/AgentDesktop.cmd"
          test -f "$root/desktop/station/audit-icon.png"
          test -f "$root/desktop/station/agent-icon.png"
          cp "$api" "$root/ops/orchestra-updater/payload/"
          cp "$root/runtime/app/bin/"{MysticEgo.Distributed,Models.Data,Npgsql,MysticEgo.Capacity}.dll "$root/ops/orchestra-updater/payload/"
          bash -n "$root/ops/orchestra-updater/bootstrap-r31.sh"
          world=services/MysticEgo.WorldAI/bin/Release/net10.0/MysticEgo.WorldAI.dll
          cp "$world" "$root/runtime/app/bin/"
          cp "$world" "$root/ops/orchestra-updater/payload/"
          installer=tools/MysticEgo.Installer/bin/Release/net10.0/MysticEgo.Installer.dll
          cp "$installer" "$root/runtime/app/bin/"
          cp "$installer" "$root/ops/orchestra-updater/payload/"
          for panel in agent audit global local orchestra; do
            python3 - "$panel" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path("frontend/apps") / sys.argv[1] / "dist"
          assert json.loads((root / "release-info.json").read_text())["installed"] == "v1.0.0-beta.7-r3.2.42"
          for style in ("immersive", "simplified"):
              for theme in ("dark", "light"):
                  for kind in ("hero", "entry", "header", "sidebar", "overview"):
                      assert list((root / "assets").glob(f"{style}-{theme}-{kind}-*.webp")), (sys.argv[1], style, theme, kind)
          for profile in ("simplified-dark-profile", "immersive-dark-profile", "light-profile"):
              assert list((root / "assets").glob(f"{profile}-*.webp")), (sys.argv[1], profile)
          if sys.argv[1] == "orchestra":
              for space in ("studio-office", "studio-club", "studio-bar"):
                  assert list((root / "assets").glob(f"{space}-*.webp")), (sys.argv[1], space)
          PY
            rm -rf "$root/runtime/app/web/$panel"
            cp -a "frontend/apps/$panel/dist" "$root/runtime/app/web/$panel"
          done
          rm -rf "$root/ops/orchestra-updater/payload/web"
          cp -a "$root/runtime/app/web/orchestra" "$root/ops/orchestra-updater/payload/web"
          stage=$(mktemp -d)
          ln -s "$root/runtime/app/web/audit" "$stage/web"
          cp "$root/ops/audit-portal/install-audit-portal.sh" "$stage/"
          bash "$stage/install-audit-portal.sh" --check
          dotnet "$desk/out/CloudDesk.dll" </dev/null
          (cd bundle && zip -qr "../$ASSET" MysticEgo)
          unzip -tq "$ASSET"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile ops/orchestra-updater/update-orchestra.py
          python3 ops/orchestra-updater/prepare-release.py "$ASSET"
          unzip -tq MysticEgo-Orchestra-linux-x64.zip
          python3 - <<'PY'
          import runpy, tempfile
          from pathlib import Path
          worker = runpy.run_path("ops/orchestra-updater/update-orchestra.py")
          with tempfile.TemporaryDirectory() as temporary:
              app = worker["unpack"](Path("MysticEgo-Orchestra-linux-x64.zip"), Path(temporary))
              for name in ("MysticEgo.DatabaseMigration.dll", "MysticEgo.DatabaseMigration.runtimeconfig.json", "MysticEgo.DatabaseMigration.deps.json"):
                  assert (app / "tools/MysticEgo.DatabaseMigration/out" / name).is_file(), name
              for script in ("reconcile.py", "install-local.sh", "install-voice.sh", "voice-server.py", "local-runner.py"):
                  assert (app / "ops/infrastructure" / script).is_file(), script
              for script in ("recover-maintenance.sh", "rescue-request.py", "install-worker.sh", "update-orchestra.py", "mysticego-maintenance-rescue.path", "mysticego-maintenance-rescue.service"):
                  assert (app / "ops/orchestra-updater" / script).is_file(), script
              for name in ("MysticEgo.Distributed.dll","MysticEgo.Capacity.dll"):
                  assert (app / "runtime/app/bin" / name).read_bytes() == (app / "ops/orchestra-updater/payload" / name).read_bytes()
              for host in ("Api.Orchestra","Api.Auth","Api.Capacity"):
                  for extension in ("dll","deps.json","runtimeconfig.json"):
                      assert (app / "runtime/app/bin" / f"{host}.{extension}").is_file()
              for component in ("orchestra", "audit", "global", "local", "agent"):
                  assert worker["panel_version"](app / worker["WEB"] / component) == "v1.0.0-beta.7-r3.2.42"
          PY
      - name: Package desktop downloads
        run: bash ops/desktop-releases/package.sh "$PWD/bundle/MysticEgo" "$PWD"
      - name: Build individual installers
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          bash -n ops/desktop-releases/installers.sh
          bash ops/desktop-releases/installers.sh "$PWD/bundle/MysticEgo" "$PWD" "$TAG"
          sha256sum MysticEgo-*-win-x64.exe MysticEgo-*-linux-x64.run > SHA256SUMS-desktop.txt
      - name: Validate and publish complete prerelease
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(MysticEgo-*-win-x64.exe MysticEgo-*-linux-x64.run)
          test "${#installers[@]}" = 8
          assets=("$ASSET" MysticEgo-Orchestra-linux-x64.zip MysticEgo-Desktop-{win,linux}-x64.zip MysticEgo-CloudDesk-{win,linux}-x64.zip "${installers[@]}" SHA256SUMS-desktop.txt)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum -c SHA256SUMS-desktop.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite an existing release or draft." >&2
            exit 1
          fi
          # A failed upload cannot expose an incomplete release to automatic updaters.
          gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'MysticEgo BETA7 R3.2.42' --notes-file docs/releases/beta7-r3.2.42.md
          gh release view "$TAG" --json assets,isDraft,tagName > "$RUNNER_TEMP/draft.json"
          python3 - "$RUNNER_TEMP/draft.json" "$TAG" "${assets[@]}" <<'PY'
          import hashlib,json,os,sys
          release=json.load(open(sys.argv[1]))
          assert release["isDraft"] and release["tagName"]==sys.argv[2]
          remote={a["name"]:a for a in release["assets"]}
          assert set(remote)==set(sys.argv[3:]), "Incomplete release assets"
          for name in sys.argv[3:]:
              assert remote[name]["size"]==os.path.getsize(name), name
              # SHA-256 metadata is mandatory for updater-facing assets; check all published files below.
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\")" > "$RUNNER_TEMP/draft-rest.json"
          python3 - "$RUNNER_TEMP/draft-rest.json" "${assets[@]}" <<'PY'
          import hashlib,json,sys
          release=json.load(open(sys.argv[1]))
          assert release["draft"]
          remote={a["name"]:a for a in release["assets"]}
          for name in sys.argv[2:]:
              with open(name,"rb") as stream:
                  digest=hashlib.file_digest(stream,"sha256").hexdigest()
              assert remote[name]["state"]=="uploaded" and remote[name].get("digest")=="sha256:"+digest, name
          PY
          gh release edit "$TAG" --draft=false --prerelease
          gh release view "$TAG" --json url,isDraft,isPrerelease,tagName

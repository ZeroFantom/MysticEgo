name: Browser experience and desktop pairing
on:
  pull_request:
    paths:
      - 'core/**'
      - 'services/MysticEgo.Distributed/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'tools/MysticEgo.CloudDesk/**'
      - 'tests/AuthSmoke/**'
      - '.github/workflows/browser-experience.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-experience:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet build core/Api.Auth/Api.Auth.csproj -c Release
      - run: dotnet run --project tests/AuthSmoke/AuthSmoke.csproj -c Release
      - run: dotnet build services/Api.Orchestra/Api.Orchestra.csproj -c Release
      - run: dotnet build tools/MysticEgo.CloudDesk/backend/CloudDesk.csproj -c Release
      - run: node --check desktop/browser-pairing.cjs && node --check desktop/station/main.mjs && node --check desktop/local/main.mjs && node --check tools/MysticEgo.CloudDesk/desktop/main.cjs
      - run: node --test desktop/browser-pairing.test.cjs
      - run: node frontend/scripts/browser-policy.test.mjs
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

name: Capacity and browser resilience
on:
  pull_request:
    paths:
      - 'services/**'
      - 'core/Models.Autorization/**'
      - 'core/Api.Auth/**'
      - 'frontend/**'
      - 'tests/CapacitySmoke/**'
      - '.github/workflows/capacity-resilience.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet build services/Api.Orchestra/Api.Orchestra.csproj -c Release
      - run: dotnet build services/Api.Capacity/Api.Capacity.csproj -c Release
      - run: dotnet build core/Api.Auth/Api.Auth.csproj -c Release
      - run: dotnet run --project tests/CapacitySmoke/CapacitySmoke.csproj -c Release
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

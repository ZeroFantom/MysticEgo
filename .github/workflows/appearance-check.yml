name: Appearance and panel build checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'desktop/**'
      - 'tools/MysticEgo.CloudDesk/**'
      - 'services/**'
      - 'core/Models.Data/**'
      - 'ops/infrastructure/**'
      - 'ops/orchestra-updater/**'
      - 'tests/InfrastructureLocalSocketSmoke.py'
      - 'tests/BetaResilienceSmoke/**'
      - '.github/workflows/appearance-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix frontend ci --ignore-scripts --no-audit
      - run: npm --prefix frontend run build
      - run: npm --prefix desktop ci --ignore-scripts --no-audit
      - run: npm --prefix desktop run build
      - run: npm --prefix tools/MysticEgo.CloudDesk install --ignore-scripts --no-audit
      - run: npm --prefix tools/MysticEgo.CloudDesk run build
      - run: |
          node --check desktop/control/effects.js
          node --check desktop/control/view.js
          node --input-type=module --check < desktop/local/view.js
          node --check desktop/station/view.js
          bash -n tools/MysticEgo.CloudDesk/update.sh
          bash -n ops/audit-portal/install-audit-portal.sh
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 -m unittest discover -s ops/infrastructure -p 'test_reconcile.py'
      - run: python3 tests/InfrastructureLocalSocketSmoke.py
      - run: |
          python3 -m py_compile ops/infrastructure/{reconcile,voice-server,local-runner}.py
          bash -n ops/infrastructure/install-local.sh
          bash -n ops/infrastructure/install-voice.sh
      - run: dotnet run --project tests/BetaResilienceSmoke/BetaResilienceSmoke.csproj
      - run: |
          for role in Orchestra Global Local Agent AuditOrchestra; do
            dotnet build "services/Api.$role/Api.$role.csproj" -c Release
          done

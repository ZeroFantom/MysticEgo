name: MysticEgo R3.2.4 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-r324.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: mysticego-release-r324

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.0-beta.7-r3.2.4
      ASSET: MysticEgo_BETA7_R3.2.4.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify previous full bundle
        run: |
          gh release download v1.0.0-beta.7-r3.2.2 --pattern MysticEgo_BETA7_R3.2.2_CloudDesk.zip
          printf '%s  %s\n' c001140a2df1dda4d369cf34fe4d0a4f8687fa8f71d29a1cd3b9fdf645ca2122 MysticEgo_BETA7_R3.2.2_CloudDesk.zip | sha256sum -c -
          unzip -q MysticEgo_BETA7_R3.2.2_CloudDesk.zip -d bundle
          git archive --format=tar HEAD | tar -xf - -C bundle/MysticEgo
      - name: Build CloudDesk and web panels
        run: |
          dotnet publish tools/MysticEgo.CloudDesk/backend/CloudDesk.csproj -c Release -o "$RUNNER_TEMP/clouddesk"
          npm --prefix tools/MysticEgo.CloudDesk install --ignore-scripts --no-audit
          npm --prefix tools/MysticEgo.CloudDesk run build
          npm --prefix frontend ci --ignore-scripts --no-audit
          npm --prefix frontend run build
          dotnet build services/Api.Orchestra/Api.Orchestra.csproj -c Release
      - name: Assemble and verify release
        run: |
          root="$PWD/bundle/MysticEgo"
          desk="$root/tools/MysticEgo.CloudDesk"
          rm -rf "$desk/dist" "$desk/out"
          cp -a tools/MysticEgo.CloudDesk/dist "$desk/dist"
          mkdir -p "$desk/out"
          cp "$RUNNER_TEMP"/clouddesk/CloudDesk.{dll,deps.json,runtimeconfig.json} "$desk/out/"
          cp -a "$RUNNER_TEMP/clouddesk/profiles" "$desk/out/"
          api=services/Api.Orchestra/bin/Release/net10.0/Api.Orchestra.dll
          cp "$api" "$root/runtime/app/bin/"
          cp "$api" "$root/ops/orchestra-updater/payload/"
          for panel in agent audit global local orchestra; do
            rm -rf "$root/runtime/app/web/$panel"
            cp -a "frontend/apps/$panel/dist" "$root/runtime/app/web/$panel"
          done
          rm -rf "$root/ops/orchestra-updater/payload/web"
          cp -a "$root/runtime/app/web/orchestra" "$root/ops/orchestra-updater/payload/web"
          stage=$(mktemp -d)
          ln -s "$root/runtime/app/web/audit" "$stage/web"
          cp "$root/ops/audit-portal/install-audit-portal.sh" "$stage/"
          bash "$stage/install-audit-portal.sh" --check
          dotnet "$desk/out/CloudDesk.dll" </dev/null
          (cd bundle && zip -qr "../$ASSET" MysticEgo)
          unzip -tq "$ASSET"
      - name: Publish prerelease
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --prerelease \
            --title 'MysticEgo BETA7 R3.2.4' \
            --notes 'CloudDesk deploys the Audit web portal on the Orchestra VPS or on a separate VPS. Both use the existing Orchestra Auth.'

name: Developer workspace
on:
  pull_request:
    paths:
      - 'services/Api.Orchestra/**'
      - 'frontend/**'
      - 'tests/DeveloperWorkspaceSmoke/**'
      - '.github/workflows/developer-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'services/Api.Orchestra/**'
      - 'frontend/**'
      - 'tests/DeveloperWorkspaceSmoke/**'
      - '.github/workflows/developer-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  developer-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet build services/Api.Orchestra/Api.Orchestra.csproj -c Release
      - run: dotnet run --project tests/DeveloperWorkspaceSmoke/DeveloperWorkspaceSmoke.csproj -c Release
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

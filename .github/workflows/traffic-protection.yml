name: Traffic protection
on:
  pull_request:
    paths:
      - 'core/Models.Autorization/Security/TrafficProtection.cs'
      - 'core/Api.Auth/**'
      - 'services/MysticEgo.Distributed/**'
      - 'tests/TrafficProtectionSmoke/**'
      - '.github/workflows/traffic-protection.yml'
  push:
    branches: [main]
    paths:
      - 'core/Models.Autorization/Security/TrafficProtection.cs'
      - 'core/Api.Auth/**'
      - 'services/MysticEgo.Distributed/**'
      - 'tests/TrafficProtectionSmoke/**'
      - '.github/workflows/traffic-protection.yml'
permissions:
  contents: read
jobs:
  traffic-protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build core/Api.Auth/Api.Auth.csproj -c Release
      - run: dotnet build services/MysticEgo.Distributed/MysticEgo.Distributed.csproj -c Release
      - run: dotnet run --project tests/TrafficProtectionSmoke/TrafficProtectionSmoke.csproj -c Release

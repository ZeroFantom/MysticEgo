<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self'; style-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>LocalDesktop</title>
<link rel="stylesheet" href="../control/style.css"><link rel="stylesheet" href="../station/station.css"></head>
<body><header class="desktop-header"><img class="product-icon" src="local-icon.png" alt="">
<div><h1>LocalDesktop</h1><p>Площадка клуба</p></div><span class="status" id="state"></span></header>
<main>
<section class="desktop-card"><h2>Удалённый Global</h2>
<form id="connect"><label>HTTPS-адрес<input name="global" type="url" required placeholder="https://global.example.com"></label>
<div class="desktop-columns"><label>Логин<input name="login" autocomplete="username" required></label>
<label>Пароль<input name="password" type="password" autocomplete="current-password" required></label></div>
<button>Загрузить список площадок</button></form>
<form id="provision" hidden><label>Площадка<select name="site" required></select></label><button>Получить профиль и запустить</button></form>
<p id="message" role="status"></p></section>
<section class="desktop-card"><h2 id="name">Local</h2><p id="address"></p>
<div class="actions"><button id="start" class="secondary">Запустить</button><button id="stop" class="secondary">Остановить</button><button id="panel">Открыть панель</button></div>
<details><summary data-interface-id="logs">Журнал запуска</summary><pre id="logs"></pre></details></section>
<details class="desktop-card"><summary data-interface-id="appearance">Оформление</summary><div id="design"></div></details>
</main><script type="module" src="view.js"></script></body></html>

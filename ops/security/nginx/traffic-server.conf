# Optional include inside the existing public HTTPS server {}.
# Preserve TLS, WebSocket upgrade, body size and application proxy locations.
# A location defining its own limit_req/limit_conn must repeat the desired inherited limits.
limit_req zone=mysticego_client burst=80 nodelay;
limit_req zone=mysticego_vhost burst=500 nodelay;
limit_req_status 429;
limit_conn mysticego_connections 100;
limit_conn mysticego_vhost_connections 4096;
limit_conn_status 429;
client_header_timeout 15s;
client_body_timeout 30s;
keepalive_timeout 30s;

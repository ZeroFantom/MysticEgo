# Include in nginx http {} once. Do not enable real_ip from arbitrary networks.
# When behind a CDN, configure its verified current egress ranges and header first.
limit_req_zone $binary_remote_addr zone=mysticego_client:20m rate=40r/s;
limit_req_zone $server_name zone=mysticego_vhost:1m rate=500r/s;
limit_conn_zone $binary_remote_addr zone=mysticego_connections:20m;
limit_conn_zone $server_name zone=mysticego_vhost_connections:1m;

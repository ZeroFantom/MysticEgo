name: mysticego-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.8.1
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/mysticego.json
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.json:/etc/prometheus/mysticego.json:ro
      - ./metrics-token:/etc/prometheus/metrics-token:ro
  grafana:
    image: grafana/grafana:12.3.1
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-password:/run/secrets/grafana-password:ro
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/mysticego-dashboards:ro
volumes:
  prometheus_data:
  grafana_data:
